# Folio 앱 컨테이너. Container Manager > 프로젝트에서 이 파일이 있는 폴더를 선택해 등록합니다.
# 같은 폴더에 .env 파일이 있어야 합니다 (.env.example 참고).
# MariaDB는 별도 컨테이너(mariadb_11.5_folio_Notion-1)를 쓰며 .env 의 DB_HOST/DB_PORT 로 접속합니다.
services:
  folio-app:
    image: node:22-bookworm-slim
    container_name: folio-app
    working_dir: /app
    command: sh -c "npm ci --omit=dev --no-audit --no-fund && node server.mjs"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4317"
      TZ: Asia/Seoul
      DATA_DIR: /data
    ports:
      - "4317:4317"
    volumes:
      - .:/app:ro
      - folio_node_modules:/app/node_modules
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4317/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  folio_node_modules:
